name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the build job (which publishes the release) may write.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04  # has the Android SDK preinstalled
    env:
      HAS_KEYSTORE: ${{ secrets.ARCHIVOLOCO_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'

      # Optional: a stable signing key so each new APK installs over the previous one.
      # Add repo secrets ARCHIVOLOCO_KEYSTORE_B64 (base64 of a .jks/.keystore) and
      # ARCHIVOLOCO_KEYSTORE_PASSWORD (+ optional ARCHIVOLOCO_KEY_ALIAS / ARCHIVOLOCO_KEY_PASSWORD).
      - name: Decode signing key
        env:
          KS: ${{ secrets.ARCHIVOLOCO_KEYSTORE_B64 }}
        if: env.HAS_KEYSTORE == 'true'
        run: echo "$KS" | base64 -d > release.keystore

      - name: Build
        env:
          ARCHIVOLOCO_KEYSTORE_PASSWORD: ${{ secrets.ARCHIVOLOCO_KEYSTORE_PASSWORD }}
          ARCHIVOLOCO_KEY_ALIAS: ${{ secrets.ARCHIVOLOCO_KEY_ALIAS }}
          ARCHIVOLOCO_KEY_PASSWORD: ${{ secrets.ARCHIVOLOCO_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ArchivoLoco-1.0.${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArchivoLoco-apk
          path: dist/*.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ArchivoLoco 1.0.${{ github.run_number }}
          files: dist/*.apk
          make_latest: true
